<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="page_title">グラフメーカー</title>
<link rel="icon" type="image/png" href="favicon.png">
<script>
  (function(){
    try{
      var t = localStorage.getItem('graphmaker-theme');
      document.documentElement.setAttribute('data-theme', (t === 'light') ? 'light' : 'dark');
    }catch(e){}
  })();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="local-badge" data-i18n="local_badge">local-only</span>
    <span class="brand-name" data-i18n="brand_name">グラフメーカー</span>
    <a href="https://daigorou-addon.github.io/daigorou-tools/" class="back-link" data-i18n="back_to_top">← Daigorou-Tools</a>
  </div>
  <div class="toolbar">
    <button id="loadDataBtn" class="ghost" data-i18n="load_data_btn">データを読み込む</button>
    <input type="file" id="loadDataInput" accept="application/json" style="display:none;">
    <button id="saveDataBtn" class="ghost" data-i18n="save_data_btn">データを保存</button>
    <button id="downloadBtn" class="primary" data-i18n="download_btn">画像を保存</button>
    <button id="themeToggleBtn" class="theme-toggle" data-i18n-title="theme_toggle_title" title="表示テーマを切り替え">☾</button>
    <select id="langSelect" class="lang-select">
      <option value="ja">日本語</option>
      <option value="en">English</option>
      <option value="ko">한국어</option>
      <option value="zh-CN">简体中文</option>
      <option value="zh-TW">繁體中文</option>
      <option value="es">Español</option>
    </select>
  </div>
</header>

<main>
  <section class="panel col-input">
    <h2 class="panel-title" data-i18n="input_heading">設定</h2>

    <div class="control-row">
      <div class="control-group">
        <label class="field-label" data-i18n="chart_type_label">グラフ種類</label>
        <div class="type-toggle">
          <button class="type-btn active" data-type="line" data-i18n="type_line">折れ線グラフ</button>
          <button class="type-btn" data-type="bar" data-i18n="type_bar">棒グラフ</button>
        </div>
      </div>
    </div>

    <div class="toggle-row">
      <label class="check-pill"><input type="checkbox" id="toggleGrid" checked> <span data-i18n="toggle_grid">グリッド表示</span></label>
      <label class="check-pill"><input type="checkbox" id="toggleLabels" checked> <span data-i18n="toggle_labels">ラベル表示</span></label>
      <label class="check-pill"><input type="checkbox" id="toggleLegend" checked> <span data-i18n="toggle_legend">凡例表示</span></label>
    </div>

    <details class="preset-tree" open>
      <summary data-i18n="presets_heading">サンプルデータ</summary>
      <ul class="tree-list" id="presetTree"></ul>
    </details>

    <div class="series-header">
      <span class="section-label" data-i18n="series_heading">系列</span>
      <button id="addSeriesBtn" class="ghost small" data-i18n="add_series_btn">＋ 系列を追加</button>
    </div>
    <p class="hint-text" data-i18n="legend_hint">系列名はそのままグラフの凡例に表示されます。ここで自由に書き換えできます。</p>
    <div id="seriesList" class="series-list"></div>

    <div class="rows-header">
      <span class="section-label" data-i18n="data_heading">データ</span>
      <div class="rows-header-btns">
        <button id="clearDataBtn" class="ghost small" data-i18n="clear_data_btn">クリア</button>
        <button id="addRowBtn" class="ghost small" data-i18n="add_row_btn">＋ 行を追加</button>
      </div>
    </div>
    <div class="table-scroll">
      <table class="data-table" id="dataTable">
        <thead><tr id="dataTableHead"></tr></thead>
        <tbody id="dataTableBody"></tbody>
      </table>
    </div>
  </section>

  <section class="panel col-preview">
    <h2 class="panel-title" data-i18n="output_heading">グラフ表示</h2>
    <div class="chart-frame">
      <canvas id="chartCanvas"></canvas>
    </div>
  </section>
</main>

<footer>
  <div data-i18n="footer_privacy_note">すべての処理はこの端末内で行われます。ファイルはどこにも送信されません。</div>
  <div class="footer-copyright">Copyright (C) 2026 daigorou-tools. All rights reserved.</div>
</footer>

<script src="i18n.js"></script>
<script src="script.js"></script>
</body>
</html>
